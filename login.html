<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk | e-PSN</title>
  <script>if(localStorage.theme==='dark'||(!('theme' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}</script>
  <script type="module" crossorigin src="/assets/main-DjJkDC82.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-D2wzrlo4.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-50 to-gray-100 dark:from-gray-950 dark:to-gray-900 font-sans antialiased flex items-center justify-center p-4"
  x-data="{
    dark: document.documentElement.classList.contains('dark'),
    showPass: false,
    toggleDark() {
      this.dark = !this.dark;
      document.documentElement.classList.toggle('dark', this.dark);
      localStorage.setItem('theme', this.dark ? 'dark' : 'light');
    }
  }">

  <!-- Dark mode toggle -->
  <button @click="toggleDark()" title="Tukar Tema"
    class="fixed top-4 right-4 p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
    <svg x-show="!dark" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
    </svg>
    <svg x-show="dark" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
    </svg>
  </button>

  <div class="w-full max-w-sm">
    <!-- Card -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
      <!-- Logo & Title -->
      <img src="/assets/logo-LCRRZP8c.png" alt="PSN Logo" class="h-14 w-auto mx-auto mb-3 object-contain">
      <h1 class="text-2xl font-bold text-teal-600 dark:text-teal-400 text-center">e-PSN</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 text-center mb-8">Sistem Pengurusan Bersepadu</p>

      <!-- Form -->
      <form class="space-y-4" @submit.prevent="window.location.href='/dashboard.html'">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Alamat E-mel</label>
          <input type="email" placeholder="nama@psn.gov.my"
            class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 dark:text-gray-100 placeholder-gray-400">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Kata Laluan</label>
          <div class="relative">
            <input :type="showPass ? 'text' : 'password'" placeholder="••••••••"
              class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2.5 pr-10 text-sm outline-none focus:ring-2 focus:ring-teal-500 dark:text-gray-100 placeholder-gray-400">
            <button type="button" @click="showPass = !showPass"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
              <svg x-show="!showPass" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg x-show="showPass" x-cloak class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <div class="text-right mt-1.5">
            <a href="#" class="text-xs text-teal-600 dark:text-teal-400 hover:underline">Lupa kata laluan?</a>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-teal-600 hover:bg-teal-700 text-white rounded-lg px-4 py-2.5 text-sm font-medium transition-colors mt-2">
          Log Masuk
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white dark:bg-gray-800 px-2 text-gray-400 dark:text-gray-500">atau</span>
        </div>
      </div>

      <!-- Back link -->
      <p class="text-sm text-center">
        <a href="/index.html" class="text-teal-600 dark:text-teal-400 hover:underline">Kembali ke Laman Utama</a>
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-400 dark:text-gray-600 mt-6">© 2025 Pusat Sains Negara</p>
  </div>
</body>
</html>
